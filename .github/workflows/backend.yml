name: backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
  workflow_dispatch:

jobs:
  # Las pruebas van **delante del despliegue**, y ésa es la única razón de que
  # este trabajo exista: este workflow empuja a producción solo, sin que nadie
  # mire, así que hasta ahora un backend roto se desplegaba igual.
  #
  # Con Postgres de verdad, y no es un lujo: treinta ficheros de prueba se
  # *saltan* solos cuando no encuentran base (`t.Skip("no database configured")`),
  # así que un verde sin ella no quiere decir nada. Es la tarjeta #38, y al
  # encenderla salió lo que tenía que salir: una prueba llevaba meses roja sin
  # que nadie pudiera verlo.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          # Las pruebas se conectan a esta base para poder crear las suyas de
          # usar y tirar; el usuario `postgres` puede crear bases.
          POSTGRES_DB: cac
        ports:
          - 5432:5432
        # Sin esto el trabajo arranca antes que la base y la primera prueba se
        # salta —no falla— dejando el verde de siempre.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Vet
        working-directory: backend
        run: go vet ./...

      - name: Test
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: cac
          DB_SSLMODE: disable
        run: go test ./internal/...

  build-push:
    runs-on: ubuntu-latest
    # La puerta. Un `workflow_dispatch` de emergencia también la pasa: si hay
    # que desplegar con las pruebas rojas, se revierte lo que las puso rojas.
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/romanshkvolkov/c-c/backend:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-push

    steps:
      - uses: actions/checkout@v4

      - name: Copy k8s manifests to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "backend/k8s/0-rbac.yaml,backend/k8s/2-deployment.yaml,backend/k8s/3-service.yaml,backend/k8s/4-http-route.yaml,backend/k8s/5-livekit.yaml,backend/k8s/6-livekit-route.yaml"
          target: "/tmp/cac-k8s"
          strip_components: 2

      - name: Apply secrets and deploy
        uses: appleboy/ssh-action@v1
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET_ACCESS: ${{ secrets.JWT_SECRET_ACCESS }}
          JWT_SECRET_REFRESH: ${{ secrets.JWT_SECRET_REFRESH }}
          IMAGE_SERVICE_URL: ${{ vars.IMAGE_SERVICE_URL }}
          IMAGE_SERVICE_CERT_CN: ${{ vars.IMAGE_SERVICE_CERT_CN }}
          IMAGE_SERVICE_API_KEY: ${{ secrets.IMAGE_SERVICE_API_KEY }}
          REPORTS_MEDIA_BUCKET: ${{ vars.REPORTS_MEDIA_BUCKET }}
          REPORTS_MEDIA_REGION: ${{ vars.REPORTS_MEDIA_REGION }}
          REPORTS_MEDIA_ACCESS_KEY_ID: ${{ secrets.REPORTS_MEDIA_ACCESS_KEY_ID }}
          REPORTS_MEDIA_SECRET_ACCESS_KEY: ${{ secrets.REPORTS_MEDIA_SECRET_ACCESS_KEY }}
          INGEST_KEY_SECRET: ${{ secrets.INGEST_KEY_SECRET }}
          REPORTS_KEK: ${{ secrets.REPORTS_KEK }}
          REPORT_TOKEN_SECRET: ${{ secrets.REPORT_TOKEN_SECRET }}
          # Voz. LIVEKIT_URL es lo que la app usa para conectar; la llave y el
          # secreto los comparten cac (acuña los tokens) y el propio LiveKit
          # (los valida) — por eso el mismo par alimenta dos secretos.
          LIVEKIT_URL: ${{ vars.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DATABASE_URL,JWT_SECRET_ACCESS,JWT_SECRET_REFRESH,IMAGE_SERVICE_URL,IMAGE_SERVICE_CERT_CN,IMAGE_SERVICE_API_KEY,REPORTS_MEDIA_BUCKET,REPORTS_MEDIA_REGION,REPORTS_MEDIA_ACCESS_KEY_ID,REPORTS_MEDIA_SECRET_ACCESS_KEY,INGEST_KEY_SECRET,REPORTS_KEK,REPORT_TOKEN_SECRET,LIVEKIT_URL,LIVEKIT_API_KEY,LIVEKIT_API_SECRET
          script: |
            kubectl create secret generic cac-secret \
              --from-literal=DATABASE_URL="$DATABASE_URL" \
              --from-literal=JWT_SECRET_ACCESS="$JWT_SECRET_ACCESS" \
              --from-literal=JWT_SECRET_REFRESH="$JWT_SECRET_REFRESH" \
              --from-literal=IMAGE_SERVICE_URL="$IMAGE_SERVICE_URL" \
              --from-literal=IMAGE_SERVICE_CERT_CN="$IMAGE_SERVICE_CERT_CN" \
              --from-literal=IMAGE_SERVICE_API_KEY="$IMAGE_SERVICE_API_KEY" \
              --from-literal=REPORTS_MEDIA_BUCKET="$REPORTS_MEDIA_BUCKET" \
              --from-literal=REPORTS_MEDIA_REGION="$REPORTS_MEDIA_REGION" \
              --from-literal=REPORTS_MEDIA_ACCESS_KEY_ID="$REPORTS_MEDIA_ACCESS_KEY_ID" \
              --from-literal=REPORTS_MEDIA_SECRET_ACCESS_KEY="$REPORTS_MEDIA_SECRET_ACCESS_KEY" \
              --from-literal=INGEST_KEY_SECRET="$INGEST_KEY_SECRET" \
              --from-literal=REPORTS_KEK="$REPORTS_KEK" \
              --from-literal=REPORT_TOKEN_SECRET="$REPORT_TOKEN_SECRET" \
              --from-literal=LIVEKIT_URL="$LIVEKIT_URL" \
              --from-literal=LIVEKIT_API_KEY="$LIVEKIT_API_KEY" \
              --from-literal=LIVEKIT_API_SECRET="$LIVEKIT_API_SECRET" \
              --dry-run=client -o yaml | kubectl apply -f -

            # El secreto que lee el propio LiveKit. Formato "clave: secreto",
            # que es lo que espera en LIVEKIT_KEYS. Se omite si no hay llaves
            # configuradas todavía, para que un despliegue sin voz no falle.
            if [ -n "$LIVEKIT_API_KEY" ]; then
              kubectl create secret generic livekit-secret \
                --from-literal=LIVEKIT_KEYS="$LIVEKIT_API_KEY: $LIVEKIT_API_SECRET" \
                --dry-run=client -o yaml | kubectl apply -f -
            fi

            kubectl apply -f /tmp/cac-k8s/
            # Force a fresh rollout so the :latest image is re-pulled and the new
            # cac-secret is picked up (apply alone is a no-op when the tag is
            # unchanged → the pod would keep the old image).
            kubectl rollout restart deployment/cac-service
            kubectl rollout status deployment/cac-service --timeout=120s
            rm -rf /tmp/cac-k8s

name: transcriber

# Construye la imagen del worker de transcripción y la publica en GHCR, igual
# que hace `backend.yml` con la suya.
#
# Existe porque sin ella la fase 0 no se puede ni intentar: el Job del spike
# (`transcriber/k8s/spike.yaml`) apunta a una etiqueta que nadie construía, así
# que se quedaba en `ImagePullBackOff`. En el nodo no hay con qué construir
# —sólo `ctr`, que importa pero no construye, y sin sudo— y meter la imagen a
# mano dejaría el clúster con algo que no está en ningún sitio.
#
# **Del spike no despliega nada**: publica la imagen y el Job se lanza a mano
# cuando hay alguien en la sala, que es media prueba del experimento.
#
# Del **montador** sí: es un proceso que vive, no un experimento, y su
# manifiesto tiene que seguir a su imagen. Se omite solo si no hay llave — una
# instalación sin grabación no lo levanta.
on:
  push:
    branches: [main]
    paths:
      - "transcriber/**"
      - ".github/workflows/transcriber.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # La suite del worker no la corre nadie más (tarjeta #69). Aquí sí, y por
      # delante de la publicación: una imagen que no pasa sus pruebas no llega
      # al registro.
      - name: Test
        working-directory: transcriber
        run: uv run --frozen pytest -q

  build-push:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./transcriber
          push: true
          # `spike` y no `latest`: esto es la imagen de la fase 0, sin modelo.
          # Cuando exista el worker entero llevará su propia etiqueta y ésta se
          # podrá retirar.
          tags: ghcr.io/romanshkvolkov/c-c/transcriber:spike

      # La misma imagen con `faster-whisper` dentro, para medir el `rtf` en el
      # hardware real — que es el único sitio donde ese número significa algo.
      # Va aparte y no en la del spike porque arrastra dos gigas de modelo.
      - name: Build and push (banco de pruebas)
        uses: docker/build-push-action@v6
        with:
          context: ./transcriber
          push: true
          build-args: |
            EXTRAS=[stt]
          tags: ghcr.io/romanshkvolkov/c-c/transcriber:bench

      # Y la del montador: `boto3` para hablar con S3 y `ffmpeg` dentro. Los
      # 200 MB de ffmpeg no los quiere ninguna de las otras dos.
      - name: Build and push (montador)
        uses: docker/build-push-action@v6
        with:
          context: ./transcriber
          push: true
          build-args: |
            EXTRAS=[mux]
            WITH_FFMPEG=1
          tags: ghcr.io/romanshkvolkov/c-c/transcriber:mux

  deploy-mux:
    runs-on: ubuntu-latest
    needs: build-push

    steps:
      - uses: actions/checkout@v4

      - name: Copy the manifest
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "transcriber/k8s/mux.yaml"
          target: /tmp/mux-k8s
          strip_components: 2

      - name: Apply
        uses: appleboy/ssh-action@v1
        env:
          RECORDINGS_MUX_KEY: ${{ secrets.RECORDINGS_MUX_KEY }}
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: RECORDINGS_MUX_KEY
          script: |
            # Sin llave no hay montador. El secreto lo crea `backend.yml`, que
            # es quien tiene las llaves de AWS; si no está, este despliegue se
            # quedaría en `CreateContainerConfigError` y nadie lo miraría.
            if [ -z "$RECORDINGS_MUX_KEY" ] || ! kubectl get secret recordings-mux-secret >/dev/null 2>&1; then
              echo "sin recordings-mux-secret: no se despliega el montador"
              rm -rf /tmp/mux-k8s
              exit 0
            fi
            kubectl apply -f /tmp/mux-k8s/mux.yaml
            # Forzar el rollout: la etiqueta `:mux` no cambia, así que `apply`
            # por sí solo dejaría el pod con la imagen vieja.
            kubectl rollout restart deployment/recordings-mux
            kubectl rollout status deployment/recordings-mux --timeout=120s
            rm -rf /tmp/mux-k8s

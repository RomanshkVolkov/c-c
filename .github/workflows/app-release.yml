name: app release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  # Las pruebas de la app, por delante de compilar nada. Es el mismo trabajo que
  # corre en cada push (`app.yml`): aquí es la puerta, y allí el aviso temprano.
  test:
    uses: ./.github/workflows/app.yml

  build:
    needs: test
    strategy:
      fail-fast: false
      # One platform at a time, and this is not about resources.
      #
      # Each job uploads `latest.json` — the updater's index — by reading the
      # one already on the release, adding its own platform and putting it
      # back. Run in parallel, two jobs read the same version and the slower
      # write wins, silently dropping the other's platform. v1.6.7 shipped with
      # only the Windows entries that way, and every Linux client got "none of
      # the fallback platforms were found" with a perfectly good AppImage
      # sitting in the same release.
      #
      # Serialising costs roughly 13 minutes per release (macOS universal is
      # the slow one). The alternative that keeps them parallel is generating
      # latest.json ourselves in a final job with includeUpdaterJson: false,
      # which trades the wait for owning the format.
      max-parallel: 1
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            args: "--bundles nsis"

    runs-on: ${{ matrix.platform }}
    # Un paso colgado —el `apt-get` de una noche se quedó veinte minutos— se
    # comería el límite por defecto de seis horas antes de rendirse. Con esto
    # falla en un tiempo que se puede mirar y relanzar.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Sync version from tag
        shell: bash
        run: |
          set -euo pipefail
          RAW_TAG="${{ github.ref_name }}"
          VERSION="${RAW_TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-].+)?$ ]]; then
            echo "Tag '$RAW_TAG' is not a semver release tag — skipping version sync"
            exit 0
          fi
          echo "Syncing version to $VERSION"
          jq --arg v "$VERSION" '.version = $v' app/src-tauri/tauri.conf.json > app/src-tauri/tauri.conf.json.tmp
          mv app/src-tauri/tauri.conf.json.tmp app/src-tauri/tauri.conf.json
          sed -i.bak '0,/^version = ".*"$/s//version = "'"$VERSION"'"/' app/src-tauri/Cargo.toml
          rm -f app/src-tauri/Cargo.toml.bak

      # ALSA (`libasound2-dev`) la pide cpal, que es como los canales de voz
      # llegan al micrófono en Linux. Sin ella `alsa-sys` no compila y el build
      # muere a mitad — y no se ve venir desde una máquina de escritorio, donde
      # ALSA ya está por estar.
      - name: Install system deps (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./app/src-tauri -> target"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend deps
        working-directory: app
        run: bun install

      # La app de macOS se firma siempre con **el mismo** certificado
      # autofirmado (MACOS_CERTIFICATE, válido hasta 2036; el original está en
      # 1Password). No es una firma de Apple —eso pide una cuenta de pago y la
      # notarización—, así que Gatekeeper sigue avisando en la primera
      # instalación. Lo que arregla es otra cosa: macOS ata el permiso del
      # micrófono y la cámara a la identidad de la firma, y con la firma ad hoc
      # del compilador esa identidad cambiaba en cada build. El permiso no se
      # quedaba, el aviso salía varias veces al entrar a una llamada y volvía
      # con cada actualización. Con una identidad fija, se concede una vez.
      #
      # `bundle.macOS.hardenedRuntime` va a `false` en tauri.conf.json a
      # propósito: Tauri lo enciende al firmar, y con él macOS **deniega** el
      # micrófono sin preguntar si la app no declara entitlements. Sólo hace
      # falta para notarizar, que aquí no hay.
      #
      # El certificado va a un llavero propio del runner y se marca de
      # confianza para firmar: `codesign` no usa una identidad que el sistema
      # no da por válida, y sin confianza un autofirmado no lo es.
      - name: Import the signing certificate (macOS)
        if: matrix.platform == 'macos-latest'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/cac-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -passin pass:"$MACOS_CERTIFICATE_PASSWORD" \
            -nokeys -clcerts -legacy -out "$RUNNER_TEMP/cert.pem" 2>/dev/null \
            || openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -passin pass:"$MACOS_CERTIFICATE_PASSWORD" \
              -nokeys -clcerts -out "$RUNNER_TEMP/cert.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem"
          rm -f "$RUNNER_TEMP/cert.p12"
          # Si la identidad no sale aquí como válida, el build firmaría ad hoc
          # sin decir nada: que reviente ahora, antes de compilar 20 minutos.
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -F "cac self-signed (guz-studio)"

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_API_URL: https://cac.guz-studio.dev
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Sólo en macOS (vacío en las demás). Con la identidad y sin
          # APPLE_CERTIFICATE, Tauri firma con lo que ya hay en el llavero.
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && secrets.MACOS_SIGNING_IDENTITY || '' }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: "C-C ${{ github.ref_name }}"
          releaseBody: |
            See the assets below to download for your platform.
          releaseDraft: false
          prerelease: false
          updaterJsonKeepUniversal: true
          args: ${{ matrix.args }}

  # A release whose updater index is incomplete looks exactly like a good one:
  # every build green, every installer published, and the failure only shows up
  # as a toast on someone's machine days later. This turns that into a red run.
  verify-updater:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Every platform must be in latest.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/latest.json"
          # Cache-buster: the CDN happily serves a stale copy right after upload.
          curl -fsSL -H 'Cache-Control: no-cache' "${url}?ci=${GITHUB_RUN_ID}" -o latest.json
          python3 - <<'PY'
          import json, sys
          want = {
              "linux-x86_64", "linux-x86_64-appimage", "linux-x86_64-deb", "linux-x86_64-rpm",
              "windows-x86_64", "windows-x86_64-nsis",
              "darwin-aarch64", "darwin-x86_64", "darwin-universal",
          }
          got = set(json.load(open("latest.json"))["platforms"])
          missing = sorted(want - got)
          if missing:
              print("latest.json is missing:", ", ".join(missing))
              print("present:", ", ".join(sorted(got)) or "(none)")
              print("\nThe installers are probably fine — it's the index that lost them.")
              sys.exit(1)
          print("all", len(want), "platforms present")
          PY

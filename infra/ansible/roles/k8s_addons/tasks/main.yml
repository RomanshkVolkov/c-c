---
# Las piezas de pixel-vps encima del clúster: Cilium (red), MetalLB (la IP
# pública para Services), Envoy Gateway (entrada) y cert-manager (TLS). CNPG,
# detrás de install_cnpg. Todo con helm y kubectl en el servidor.
# Un repo que falta se añade también en el ensayo: en --check no se añadiría
# y el chart de después no lo encontraría («repo metrics-server not found»,
# gstd, 3-nov-2026). Es un índice en el disco de root, no un cambio del
# clúster. Y cada chart refresca el índice antes de buscar su versión: la
# que se fija puede ser más nueva que la caché.
- name: Repos de helm
  kubernetes.core.helm_repository:
    name: "{{ item.name }}"
    repo_url: "{{ item.url }}"
  check_mode: false
  loop:
    - {name: cilium, url: "https://helm.cilium.io"}
    - {name: metallb, url: "https://metallb.github.io/metallb"}
    - {name: jetstack, url: "https://charts.jetstack.io"}
    - {name: cnpg, url: "https://cloudnative-pg.github.io/charts"}
    - {name: metrics-server, url: "https://kubernetes-sigs.github.io/metrics-server"}

# VXLAN y con kube-proxy, como pixel-vps; el pool de pods es pod_cidr (ver
# los defaults de `k8s` en cac.playbooks.yml: aquí no se solapa con la red de
# Services).
- name: Cilium {{ cilium_version }}
  kubernetes.core.helm:
    name: cilium
    chart_ref: cilium/cilium
    update_repo_cache: true
    chart_version: "{{ cilium_version }}"
    release_namespace: kube-system
    wait: true
    timeout: 10m
    values:
      kubeProxyReplacement: false
      routingMode: tunnel
      tunnelProtocol: vxlan
      ipam:
        mode: cluster-pool
        operator:
          clusterPoolIPv4PodCIDRList: ["{{ pod_cidr }}"]
      operator:
        replicas: 1

- name: El nodo Ready (con red)
  ansible.builtin.command: kubectl wait --for=condition=Ready node --all --timeout=300s
  changed_when: false

# El kubelet de un nodo kubeadm sirve su certificado con el nombre del nodo,
# no firmado por la CA del clúster: metrics-server lo acepta así, como en
# cualquier kubeadm de un nodo.
- name: metrics-server {{ metrics_server_version }}
  kubernetes.core.helm:
    name: metrics-server
    chart_ref: metrics-server/metrics-server
    update_repo_cache: true
    chart_version: "{{ metrics_server_version }}"
    release_namespace: kube-system
    wait: true
    values:
      args: [--kubelet-insecure-tls]

# Almacenamiento por defecto, como pixel-vps (`local-path`): sin una
# StorageClass por defecto un PVC se queda Pending y nada con disco arranca.
# El manifiesto va fijado a su versión y pasa por el servidor; la clase por
# defecto la pone el patch, porque el manifiesto no la marca.
- name: Manifiesto de local-path-provisioner {{ local_path_provisioner_version }}
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/rancher/local-path-provisioner/{{ local_path_provisioner_version }}/deploy/local-path-storage.yaml"
    dest: /etc/cac/local-path-storage.yaml
    mode: "0600"

- name: Aplicar local-path-provisioner
  ansible.builtin.command: kubectl apply --server-side --force-conflicts -f /etc/cac/local-path-storage.yaml
  register: local_path_apply
  changed_when: "'serverside-applied' in local_path_apply.stdout and 'unchanged' not in local_path_apply.stdout"

- name: local-path es la StorageClass por defecto
  ansible.builtin.command: >-
    kubectl patch storageclass local-path
    -p '{"metadata":{"annotations":{"storageclass.kubernetes.io/is-default-class":"true"}}}'
  register: local_path_default
  changed_when: "'(no change)' not in local_path_default.stdout"

- name: MetalLB {{ metallb_version }}
  kubernetes.core.helm:
    name: metallb
    chart_ref: metallb/metallb
    update_repo_cache: true
    chart_version: "{{ metallb_version }}"
    release_namespace: metallb-system
    create_namespace: true
    wait: true

- name: Envoy Gateway {{ envoy_gateway_version }}
  kubernetes.core.helm:
    name: envoy-gateway
    chart_ref: oci://docker.io/envoyproxy/gateway-helm
    chart_version: "{{ envoy_gateway_version }}"
    release_namespace: envoy-gateway-system
    create_namespace: true
    wait: true
    timeout: 10m

- name: cert-manager {{ cert_manager_version }}
  kubernetes.core.helm:
    name: cert-manager
    chart_ref: jetstack/cert-manager
    update_repo_cache: true
    chart_version: "{{ cert_manager_version }}"
    release_namespace: cert-manager
    create_namespace: true
    wait: true
    values:
      # installCRDs está deprecado desde la 1.15: es esto mismo.
      crds:
        enabled: true
        keep: true

- name: CloudNativePG
  when: install_cnpg | bool
  kubernetes.core.helm:
    name: cnpg
    chart_ref: cnpg/cloudnative-pg
    update_repo_cache: true
    chart_version: "{{ cnpg_version }}"
    release_namespace: cnpg-system
    create_namespace: true
    wait: true

# El token de Cloudflare entra por stdin y del lado del servidor: ni en la
# línea de comandos ni en la anotación last-applied (por --server-side).
- name: Secret con el token de DNS para cert-manager
  ansible.builtin.shell:
    cmd: >-
      kubectl -n cert-manager create secret generic cloudflare-dns-token
      --from-file=api-token=/dev/stdin --dry-run=client -o yaml
      | kubectl apply --server-side --force-conflicts -f -
    stdin: "{{ cloudflare_dns_token }}"
    stdin_add_newline: false
  register: dns_secret
  changed_when: "'serverside-applied' in dns_secret.stdout and 'unchanged' not in dns_secret.stdout"
  no_log: true

# Un wildcard sólo lo emite DNS-01, y el solver DNS sólo cubre dns_zone: un
# dominio de `certificates` fuera de la zona caería en el solver http01 y su
# `*.<d>` no saldría nunca, sin decir por qué. Se dice antes.
- name: Los dominios con certificado wildcard cuelgan de la zona
  ansible.builtin.assert:
    that: >-
      certificates | default([]) | reject('match', '^(.+\.)?' ~ (dns_zone | lower | regex_escape) ~ '$')
      | list | length == 0
    fail_msg: >-
      Todo dominio de `certificates` tiene que ser {{ dns_zone }} o colgar de
      ella: un wildcard sólo se emite por DNS y el token de Cloudflare es de
      esa zona. Un dominio de otra zona va en un Certificate propio de su app,
      sin wildcard, por HTTP-01.
    quiet: true

- name: Manifiestos del clúster
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/cac/{{ item }}"
    mode: "0600"
  loop: [cluster.yaml, whoami.yaml]

# Los CRD de MetalLB y cert-manager tienen webhooks que tardan en contestar
# después de que el chart dice «listo»: se reintenta. En un ensayo no corre
# (el comando no corre en --check y reintentaría hasta rendirse).
- name: Aplicar pool, Gateway, emisor y certificado
  ansible.builtin.command: kubectl apply --server-side -f /etc/cac/cluster.yaml
  register: cluster_apply
  until: cluster_apply.rc == 0
  retries: 12
  delay: 10
  changed_when: "'serverside-applied' in cluster_apply.stdout"
  when: not ansible_check_mode

# Hasta el 3-nov-2026 el certificado era uno solo, `wildcard` → `secret-tls`.
# Ahora cada zona tiene el suyo (`wildcard-<zona>` → `tls-<zona>`) y aquél ya
# no lo referencia nadie: fuera, para que no siga renovándose por su cuenta.
- name: Certificado único de antes, fuera
  ansible.builtin.command: kubectl -n default delete certificate wildcard secret secret-tls --ignore-not-found
  register: old_cert
  changed_when: "'deleted' in old_cert.stdout"
  when: not ansible_check_mode

- name: Aplicar whoami
  ansible.builtin.command: kubectl apply --server-side -f /etc/cac/whoami.yaml
  register: whoami_apply
  changed_when: "'serverside-applied' in whoami_apply.stdout"

---
# Etapa 1: la configuración básica de cualquier servidor, sea cual sea lo que
# corra encima. Deja un usuario de operación con sus llaves y sudo con
# contraseña, SSH sólo por llave, sin root y en otro puerto, firewall y
# fail2ban. El cambio de SSH en sí (escribir la configuración, reiniciar y
# comprobar) lo hace el playbook server-baseline, que sabe deshacerlo.
- name: Paquetes base
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg, jq, python3-yaml, ufw, fail2ban, sudo]
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 180

- name: Hay contraseña para el sudo del usuario de operación
  ansible.builtin.assert:
    that: ops_password | default('') | length >= 16
    fail_msg: >-
      Falta ops_password (o es corta). Sale del secreto OPS_PASSWORD de la
      config del servidor en cac: su referencia de 1Password.
    quiet: true

# La sal sale del nombre del host: el hash es el mismo en cada pasada y el
# usuario no «cambia» cada vez que se corre.
- name: Usuario de operación, con sudo por contraseña
  ansible.builtin.user:
    name: "{{ ops_user }}"
    shell: /bin/bash
    create_home: true
    groups: [sudo]
    append: true
    password: >-
      {{ ops_password | password_hash('sha512',
         (inventory_hostname ~ ':cac') | hash('sha1') | truncate(16, true, '')) }}
  no_log: true

- name: Sus llaves (sólo éstas)
  ansible.posix.authorized_key:
    user: "{{ ops_user }}"
    key: "{{ ops_authorized_keys | join('\n') }}"
    exclusive: true

- name: Directorio de cac en el servidor
  ansible.builtin.file:
    path: /etc/cac
    state: directory
    owner: root
    group: root
    mode: "0700"

# Primero las reglas, después encender: al revés, el playbook se corta la rama
# en la que está sentado. El 22 se queda abierto hasta que el puerto nuevo
# contesta; lo cierra el playbook.
- name: SSH entra por el puerto nuevo (y por el de ahora, mientras tanto)
  community.general.ufw:
    rule: limit
    port: "{{ item | string }}"
    proto: tcp
  loop: "{{ [ssh_port | int, ansible_port | default(22) | int] | unique }}"

- name: Lo enrutado pasa (contenedores y pods)
  community.general.ufw:
    direction: routed
    default: allow

- name: Sale todo
  community.general.ufw:
    direction: outgoing
    default: allow

# En gstd la salida por IPv6 corta las descargas grandes a medias («connection
# reset by peer»): una capa de 308 MB de GHCR se cortó a los 201 MB por IPv6 y
# bajó entera las cuatro veces por IPv4 (4-nov-2026, incidente 4b2b4ad0).
# containerd, como todo programa en Go, prefiere IPv6 si el destino lo tiene.
# Con `reject` (no `deny`) la conexión IPv6 falla al instante y Go, curl o apt
# pasan a IPv4 sin esperar. No se toca la red (el netplan de Contabo): un
# error ahí deja el servidor sin SSH. Lo de `lo` y el ICMPv6 de vecinos los
# deja pasar ufw antes de estas reglas.
- name: Sin salida por IPv6
  community.general.ufw:
    rule: reject
    direction: out
    to_ip: "::/0"
    comment: cac - IPv6 egress cuts large downloads (4b2b4ad0)
  when: block_ipv6_egress | default(false) | bool

- name: Entra sólo lo permitido, y encender
  community.general.ufw:
    direction: incoming
    default: deny
    state: enabled

- name: fail2ban vigila el SSH en su puerto
  ansible.builtin.template:
    src: fail2ban-sshd.conf.j2
    dest: /etc/fail2ban/jail.d/cac-sshd.conf
    mode: "0644"
  notify: Reiniciar fail2ban

- name: fail2ban activo
  ansible.builtin.systemd_service:
    name: fail2ban
    state: started
    enabled: true

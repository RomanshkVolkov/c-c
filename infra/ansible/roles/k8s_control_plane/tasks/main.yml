---
# kubeadm init de un control plane de un nodo, más helm. Sin abrir el 6443 a
# internet: se opera con kubectl en el servidor (por ssh), como pixel-vps.
- name: El nombre del control plane resuelve a este nodo
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ public_ip }} {{ inventory_hostname }}-cp"
    regexp: '\s{{ inventory_hostname }}-cp$'

- name: Configuración de kubeadm
  ansible.builtin.template:
    src: kubeadm-config.yaml.j2
    dest: /etc/cac/kubeadm-config.yaml
    mode: "0600"

- name: ¿Ya hay clúster?
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: admin_conf

# Sin kube-proxy fuera: Cilium corre con kube-proxy, como en pixel-vps.
- name: kubeadm init
  ansible.builtin.command: kubeadm init --config /etc/cac/kubeadm-config.yaml
  when: not admin_conf.stat.exists
  changed_when: true

- name: kubectl de root lee el admin.conf
  ansible.builtin.file:
    path: /root/.kube
    state: directory
    mode: "0700"

- name: Copiar el admin.conf
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /root/.kube/config
    remote_src: true
    mode: "0600"

# El usuario de operación también opera el clúster, sin sudo, como en
# pixel-vps: hasta el 3-nov-2026 sólo root leía el admin.conf y un
# `ssh gstd kubectl …` contestaba «connection refused» en localhost:8080.
- name: kubectl del usuario de operación
  ansible.builtin.file:
    path: "/home/{{ ops_user }}/.kube"
    state: directory
    owner: "{{ ops_user }}"
    group: "{{ ops_user }}"
    mode: "0700"

# En un ensayo el directorio de arriba no se crea, y `copy` con `remote_src`
# exige que exista: la primera vez el ensayo se salta la copia (la enseña el
# directorio) y al correr de verdad sí la hace (gstd, 3-nov-2026).
- name: ¿Tiene ya su .kube?
  ansible.builtin.stat:
    path: "/home/{{ ops_user }}/.kube"
  register: ops_kube

- name: Copiar el admin.conf al usuario de operación
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "/home/{{ ops_user }}/.kube/config"
    remote_src: true
    owner: "{{ ops_user }}"
    group: "{{ ops_user }}"
    mode: "0600"
  when: ops_kube.stat.exists or not ansible_check_mode

# Un parche nuevo de Kubernetes (k8s_version) no es sólo subir los paquetes:
# el control plane corre como pods estáticos con la versión del init, y los
# sube `kubeadm upgrade apply`. Sin esto apt deja un kubelet más nuevo que su
# apiserver (gstd, 3-nov-2026: paquetes 1.35.0 → 1.35.10). kubeadm ya es la
# versión nueva (k8s_node lo subió con los demás), que es lo que pide.
- name: Versión del control plane
  ansible.builtin.command: kubectl version -o json
  register: cp_version
  changed_when: false
  check_mode: false

# apt acaba de reiniciar containerd y kubelet (los subió): el nodo pasa unos
# segundos sin estar Ready y el primer pod tarda en arrancar. El preflight de
# kubeadm crea un Job de salud con un tope de 15 s y lo dio por muerto a los
# 12 s de arrancar el pod (gstd, 3-nov-2026). Se espera al nodo y se insiste.
- name: El nodo Ready antes de subir el control plane
  ansible.builtin.command: kubectl wait --for=condition=Ready node --all --timeout=300s
  changed_when: false
  check_mode: false
  when: (cp_version.stdout | from_json).serverVersion.gitVersion != 'v' ~ k8s_version

- name: kubeadm upgrade apply v{{ k8s_version }}
  ansible.builtin.command: kubeadm upgrade apply v{{ k8s_version }} --yes
  register: cp_upgrade
  until: cp_upgrade.rc == 0
  retries: 3
  delay: 20
  when:
    - not ansible_check_mode
    - (cp_version.stdout | from_json).serverVersion.gitVersion != 'v' ~ k8s_version
  changed_when: true

# El paquete nuevo de kubelet no reinicia el servicio: hasta reiniciarlo
# sigue corriendo el binario viejo.
- name: kubelet reiniciado con su versión nueva
  ansible.builtin.systemd_service:
    name: kubelet
    state: restarted
    daemon_reload: true
  when: (cp_version.stdout | from_json).serverVersion.gitVersion != 'v' ~ k8s_version

# Un solo nodo: el control plane también corre cargas.
- name: Quitar el taint del control plane
  ansible.builtin.shell:
    cmd: >-
      kubectl taint nodes --all node-role.kubernetes.io/control-plane:NoSchedule- 2>&1
      | grep -q 'untainted' && echo changed || true
  register: untaint
  changed_when: "'changed' in untaint.stdout"

- name: ¿Está helm {{ helm_version }}?
  ansible.builtin.shell:
    cmd: helm version --short 2>/dev/null | grep -q '^{{ helm_version }}'
  register: helm_check
  changed_when: false
  failed_when: false

- name: Instalar helm {{ helm_version }}
  ansible.builtin.unarchive:
    src: https://get.helm.sh/helm-{{ helm_version }}-linux-amd64.tar.gz
    dest: /usr/local/bin
    remote_src: true
    extra_opts: [--strip-components=1, linux-amd64/helm]
    mode: "0755"
  when: helm_check.rc != 0

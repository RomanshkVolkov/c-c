---
# Lo común de la etapa 2 (Swarm o Kubernetes): la clave con la que se versionan
# los secrets y el firewall abierto a lo web. Lo del servidor en sí (usuario,
# SSH, firewall cerrado) es la etapa 1: roles/baseline.
- name: Directorio de cac en el servidor
  ansible.builtin.file:
    path: /etc/cac
    state: directory
    owner: root
    group: root
    mode: "0700"

# La clave de los nombres de secret por versión: se crea una vez y no sale de
# aquí. `creates` la hace idempotente.
- name: Clave del HMAC de versiones de secrets
  ansible.builtin.shell:
    cmd: umask 077 && head -c 32 /dev/urandom > {{ secret_hmac_key_path | quote }}
    creates: "{{ secret_hmac_key_path }}"

- name: El firewall deja entrar lo web
  community.general.ufw:
    rule: allow
    port: "{{ item | string }}"
    proto: tcp
  loop: "{{ firewall_web_ports }}"

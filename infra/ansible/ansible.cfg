# Lo que cac sabe aprovisionar. Corre en la máquina de quien lo lanza (desde la
# terminal con `make`/`cac provision`, o desde la pestaña Provisioning de la
# app). Las llaves SSH las da el agente de 1Password. Sin inventario: lo genera
# cac en cada ejecución, de un solo host, con la config del servidor.
[defaults]
roles_path            = roles
collections_path      = ./collections
stdout_callback       = default
retry_files_enabled   = false
interpreter_python    = auto_silent
callbacks_enabled     = ansible.posix.profile_tasks
forks                 = 10

[ssh_connection]
# Con pipelining, lo que entra por stdin (los tokens) no se escribe en disco
# del servidor.
pipelining = true
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s -o PreferredAuthentications=publickey

[inventory]
enable_plugins     = yaml
unparsed_is_failed = true

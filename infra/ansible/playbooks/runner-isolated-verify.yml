---
# Comprueba el runner aislado: su listener conectado a GitHub, que su cuenta
# sólo tiene permisos en su namespace, y que desde ese namespace no se llega a
# nada de cac pero sí a internet. Lo de la red se prueba con un pod de verdad
# (se borra solo): una política que no se aplica no da ningún error.
- name: Verificar el runner aislado
  hosts: k8s_control_plane
  become: true
  gather_facts: false
  vars:
    ns: "arc-runners-{{ runner_isolated_name }}"
  tasks:
    # Por nombre Y namespace: otro scale set (el de cac) puede llamarse igual.
    - name: El listener del scale set está arriba
      ansible.builtin.shell:
        cmd: >-
          kubectl -n arc-systems get pods -l actions.github.com/scale-set-name={{ runner_isolated_name }},actions.github.com/scale-set-namespace={{ ns }}
          -o jsonpath='{.items[*].status.phase}'
      register: listener
      changed_when: false
      check_mode: false
      until: "'Running' in listener.stdout"
      retries: 30
      delay: 10

    - name: Sin Docker privilegiado
      ansible.builtin.shell:
        cmd: >-
          kubectl -n {{ ns }} get autoscalingrunnerset {{ runner_isolated_name }}
          -o jsonpath='{.spec.template.spec.containers[*].name} {.spec.template.spec.containers[*].securityContext.privileged}'
      register: ars
      changed_when: false
      check_mode: false
      failed_when: ars.rc != 0 or 'dind' in ars.stdout or 'true' in ars.stdout

    # La cuenta del runner (la crea el chart en modo kubernetes) necesita crear
    # pods en SU namespace; fuera de él, nada más que lo que todo autenticado
    # puede.
    - name: Fuera de su namespace, la cuenta del runner no puede nada
      ansible.builtin.shell:
        cmd: >-
          kubectl auth can-i --list --as=system:serviceaccount:{{ ns }}:{{ runner_isolated_name }}-gha-rs-kube-mode -n default
          | awk 'NR > 1 && $1 !~ /^\[/ && $1 !~ /^selfsubject/'
      register: perms
      changed_when: false
      check_mode: false
      failed_when: perms.rc != 0 or perms.stdout | length > 0

    - name: Desde su namespace no se llega a cac, y sí a internet
      ansible.builtin.shell:
        cmd: >-
          kubectl -n {{ ns }} run netcheck-{{ 99999 | random }} --rm -i --restart=Never --quiet
          --image=busybox:1.37 --command -- sh -c '
          for t in postgres-rw.data:5432 valkey.data:6379 cac-service.cac:80 livekit-redis.cac:6379 kubernetes.default:443; do
            h=${t%:*}; p=${t#*:};
            if nc -z -w 3 $h $p; then echo "ABIERTO $t"; else echo "cerrado $t"; fi;
          done;
          if wget -q -T 10 -O /dev/null https://api.github.com; then echo "internet ok"; else echo "SIN internet"; fi'
      register: net
      changed_when: false
      check_mode: false
      # kubernetes.default va al API: lo necesita el hook, tiene que estar
      # abierto. Todo lo demás de la lista es de cac y tiene que estar cerrado.
      failed_when: >-
        net.rc != 0
        or 'ABIERTO postgres' in net.stdout or 'ABIERTO valkey' in net.stdout
        or 'ABIERTO cac-service' in net.stdout or 'ABIERTO livekit' in net.stdout
        or 'cerrado kubernetes' in net.stdout or 'internet ok' not in net.stdout

    - name: Resultado
      ansible.builtin.debug:
        var: net.stdout_lines

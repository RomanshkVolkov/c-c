---
# Los secretos de cac en su namespace, desde 1Password (ítem «cac prod» de la
# bóveda Private, referenciado en la config del servidor). Ver
# roles/cac_secrets. El namespace y los permisos del runner los pone el
# playbook `runner` (runner_deploy_namespaces).
- name: Secretos de cac
  hosts: k8s_control_plane
  become: true
  gather_facts: false
  roles:
    - {role: cac_secrets, tags: [cac-secrets]}

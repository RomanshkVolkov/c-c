---
# Comprueba que los cuatro Secrets de cac están y que cac-secret trae todas sus
# claves. No enseña ningún valor: sólo cuenta claves.
- name: Verificar los secretos de cac
  hosts: k8s_control_plane
  become: true
  gather_facts: false
  tasks:
    - name: Los cuatro Secrets
      ansible.builtin.command: >-
        kubectl -n {{ cac_namespace }} get secret cac-secret cac-valkey livekit-secret recordings-mux-secret -o name
      changed_when: false
      check_mode: false

    - name: cac-secret trae sus 33 claves
      ansible.builtin.shell:
        cmd: kubectl -n {{ cac_namespace }} get secret cac-secret -o json | jq '.data | keys | length'
      register: keys
      changed_when: false
      check_mode: false
      failed_when: keys.stdout | int != 33

---
# Comprueba nodo, red, Gateway, certificado y que whoami contesta por HTTPS.
# No cambia nada.
- name: Verificar el clúster
  hosts: k8s_control_plane
  become: true
  gather_facts: false
  # Todo aquí sólo lee: corre también en un ensayo (`check_mode: false` en
  # cada tarea), que si no, se saltaría y el ensayo no comprobaría nada.
  tasks:
    - name: Nodo Ready
      ansible.builtin.command: kubectl wait --for=condition=Ready node --all --timeout=60s
      changed_when: false
      check_mode: false

    - name: Nada de sistema fuera de Running
      ansible.builtin.shell:
        cmd: >-
          kubectl get pods -A --no-headers
          | grep -vE '\s(Running|Completed)\s' || true
      register: bad_pods
      changed_when: false
      check_mode: false
      failed_when: bad_pods.stdout | length > 0

    # Los CRD de Gateway API tienen que ser los del chart de Envoy Gateway:
    # con unos viejos el controlador no vigila TCPRoute y el TURN no se
    # engancha, sin ningún error (gstd, 5-nov-2026).
    - name: Los CRD de Gateway API son los del chart de Envoy Gateway
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          want=$(helm show crds oci://docker.io/envoyproxy/gateway-helm --version {{ envoy_gateway_version }} \
            | grep -m1 'gateway.networking.k8s.io/bundle-version:' | awk '{print $2}')
          have=$(kubectl get crd tcproutes.gateway.networking.k8s.io \
            -o jsonpath='{.metadata.annotations.gateway\.networking\.k8s\.io/bundle-version}')
          echo "chart=$want instalados=$have"
          [ -n "$want" ] && [ "$want" = "$have" ]
        executable: /bin/bash
      changed_when: false
      check_mode: false

    - name: Gateway programado con la IP pública
      ansible.builtin.command: >-
        kubectl -n default wait gateway/gateway-api --for=condition=Programmed --timeout=120s
      changed_when: false
      check_mode: false

    # Todos: hay uno por zona de `certificates`, y el de un dominio nuevo
    # tiene que salir igual que el primero.
    - name: Certificados emitidos
      ansible.builtin.command: >-
        kubectl -n default wait certificate --all --for=condition=Ready --timeout=300s
      changed_when: false
      check_mode: false

    - name: whoami contesta por HTTPS con certificado válido
      ansible.builtin.uri:
        url: "https://whoami.{{ base_domain }}/"
        validate_certs: true
      register: whoami
      until: whoami.status == 200
      retries: 12
      delay: 10
      delegate_to: localhost
      become: false
      check_mode: false
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"

    - name: Estado
      ansible.builtin.command: kubectl get nodes,gateway,certificate,httproute -A -o wide
      register: state
      changed_when: false
      check_mode: false

    - name: Resultado
      ansible.builtin.debug:
        var: state.stdout_lines

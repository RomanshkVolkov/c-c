---
# ansible-galaxy collection install -r requirements.yml -p ./collections
# Versiones fijadas a propósito.
collections:
  - name: community.docker      # docker_swarm, docker_network, docker_secret
    version: "3.13.0"
  - name: community.general     # cloudflare_dns, ufw
    version: "10.7.0"
  - name: ansible.posix         # sysctl, el callback profile_tasks
    version: "1.6.2"
  - name: kubernetes.core       # helm (sólo necesita el binario en el servidor)
    version: "5.0.0"

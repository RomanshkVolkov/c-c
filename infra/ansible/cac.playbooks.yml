# Lo que la pestaña Provisioning de un servidor enseña (app/src-tauri/src/ansible.rs).
# Corre en la máquina de quien lo lanza, con el .venv de esta carpeta (make setup).
# Lo que viene de 1Password se lee al correr y se tacha de la salida; a cac sólo
# llegan quién, contra qué, los NOMBRES de las variables y el PLAY RECAP.
# Las referencias son las mismas que secrets.env: si cambias una, cambia la otra.
#
# Por etapas: la 1 (server-baseline) deja el servidor con usuario de operación,
# SSH sólo por llave en otro puerto y firewall; la 2 es Swarm o Kubernetes.
version: 1
venv: .venv
inventory: inventory/hosts.yml
playbooks:
  - id: test
    file: playbooks/test.yml
    name: Probar conexión
    description: Ping y quién soy en cada host, antes o después de la etapa 1. No cambia nada.
    hosts: all

  - id: baseline
    file: playbooks/server-baseline.yml
    name: "Etapa 1 · Configuración básica"
    description: >-
      Usuario infra_devops con sus llaves y sudo con contraseña; SSH sólo por
      llave, sin root y en ssh_port; ufw y fail2ban. Si el SSH nuevo no
      contesta, se deshace solo. Idempotente.
    hosts: all
    become: true
    become_password_ref: "op://Employee/gstd infra_devops/password"
    vars:
      - name: ops_password
        description: La contraseña de sudo de infra_devops.
        from: "op://Employee/gstd infra_devops/password"
        secret: true

  - id: swarm
    file: playbooks/swarm-site.yml
    name: "Etapa 2 · Swarm + Traefik"
    description: >-
      Docker, Swarm, Traefik con wildcard *.<base_domain> por DNS en
      Cloudflare, y whoami como prueba. Idempotente.
    hosts: swarm
    become: true
    become_password_ref: "op://Employee/gstd infra_devops/password"
    vars:
      - name: cloudflare_dns_token
        description: Token de Cloudflare con DNS Edit sobre la zona del servidor.
        from: "op://Employee/cloudflare guz-studio.dev dns/credential"

  - id: swarm-verify
    file: playbooks/swarm-verify.yml
    name: Verificar Swarm
    description: Nodo, servicios y whoami por HTTPS con certificado válido. No cambia nada.
    hosts: swarm
    become: true
    become_password_ref: "op://Employee/gstd infra_devops/password"

  - id: swarm-teardown
    file: playbooks/swarm-teardown.yml
    name: Desmontar Swarm
    description: Quita los stacks, sale del Swarm y desinstala Docker. Destructivo.
    hosts: swarm
    become: true
    become_password_ref: "op://Employee/gstd infra_devops/password"

  - id: k8s
    file: playbooks/k8s-site.yml
    name: "Etapa 2 · Kubernetes (kubeadm) como pixel-vps"
    description: >-
      containerd, kubeadm, Cilium, MetalLB, Envoy Gateway, cert-manager con el
      wildcard por DNS, y whoami por HTTPRoute. Antes, desmontar Swarm. Idempotente.
    hosts: k8s_control_plane
    become: true
    become_password_ref: "op://Employee/gstd infra_devops/password"
    vars:
      - name: cloudflare_dns_token
        description: Token de Cloudflare con DNS Edit sobre la zona del servidor.
        from: "op://Employee/cloudflare guz-studio.dev dns/credential"

  - id: k8s-verify
    file: playbooks/k8s-verify.yml
    name: Verificar Kubernetes
    description: Nodo, pods, Gateway, certificado y whoami por HTTPS. No cambia nada.
    hosts: k8s_control_plane
    become: true
    become_password_ref: "op://Employee/gstd infra_devops/password"

  - id: k8s-teardown
    file: playbooks/k8s-teardown.yml
    name: Desmontar Kubernetes
    description: kubeadm reset, paquetes fuera y red limpia. Destructivo.
    hosts: k8s_control_plane
    become: true
    become_password_ref: "op://Employee/gstd infra_devops/password"

# Lo que cac sabe aprovisionar: el CÓMO. El QUÉ de cada servidor (su dominio,
# su puerto SSH, sus llaves, las versiones, y DÓNDE está cada secreto en
# 1Password) vive en cac, en la config versionada del servidor y en su
# plantilla. Ver docs/integrations/provisioning.md.
#
# Versión 2: sin inventario ni referencias. La app (o `cac provision` en la
# terminal) genera un inventario de un solo host con la conexión del servidor y
# sus variables, y lee los secretos de 1Password con las referencias de su
# config. Aquí cada playbook sólo declara qué variables pide:
#   - `default`: el valor con el que nace una plantilla. Nunca en un secreto.
#   - `required`: sin él, la app no deja correr.
#   - `type: list`: es una lista aunque no traiga default (la app la pide una
#     por línea).
#   - `secret` + `from: NOMBRE`: el valor sale del secreto NOMBRE de la config
#     del servidor (una referencia de 1Password) y se tacha de la salida. Una
#     referencia aquí es un error: son de cada servidor, no del repo.
#   - `become_password_from: NOMBRE`: la contraseña de sudo, igual.
#
# Y cada playbook declara su riesgo, que es lo que cac mira cuando un agente
# pide aplicarlo (decisión 4d28f4ab):
#   - `risk: read`: no cambia nada. Es lo único que va pre-autorizado, y sólo
#     si su ensayo (`--check --diff`) dice que no cambiaría nada.
#   - `risk: change`: cambia la máquina. Siempre lo aprueba una persona.
#   - `risk: destructive`: borra o tumba. Lo aprueba una persona escribiendo
#     el nombre del servidor.
#   Los que cambian o destruyen nombran su `verify` (un playbook `read` que
#   comprueba que salió bien) y su `rollback` (el que lo deshace, o `manual`
#   si no hay playbook que lo deshaga). El rollback nunca corre solo.
#
# Por etapas: la 1 (baseline) deja el servidor con usuario de operación, SSH
# sólo por llave en otro puerto y firewall; la 2 es Swarm o Kubernetes. Una
# plantilla es una secuencia de estos ids: [baseline, swarm].
version: 2
venv: .venv
playbooks:
  - id: test
    file: playbooks/test.yml
    name: Probar conexión
    description: Ping y quién soy, antes o después de la etapa 1. No cambia nada.
    hosts: all
    risk: read

  - id: baseline
    file: playbooks/server-baseline.yml
    name: "Etapa 1 · Configuración básica"
    description: >-
      Usuario de operación con sus llaves y sudo con contraseña; SSH sólo por
      llave, sin root y en ssh_port; ufw y fail2ban. La primera vez entra como
      root por el 22. Si el SSH nuevo no contesta, se deshace solo. Después,
      cambia el puerto y el usuario del servidor en cac. Idempotente.
    hosts: all
    risk: change
    verify: test
    # Si el SSH nuevo no contesta se deshace solo; si algo queda mal después,
    # se arregla desde la consola del proveedor.
    rollback: manual
    become: true
    become_password_from: OPS_PASSWORD
    vars:
      - name: ops_user
        description: El usuario de operación.
        default: infra_devops
      - name: ssh_port
        description: El puerto SSH después de la etapa 1.
        required: true
      - name: ops_authorized_keys
        description: Las llaves públicas que entran como el usuario de operación.
        type: list
        required: true
      - name: block_ipv6_egress
        description: >-
          Rechazar toda salida por IPv6 (todo sale por IPv4). Para un servidor
          cuya red IPv6 corta las descargas, como gstd con GHCR.
        default: false
      - name: public_ip
        description: La IP pública del servidor.
        required: true
      - name: ops_password
        description: La contraseña de sudo del usuario de operación (mínimo 16).
        secret: true
        from: OPS_PASSWORD

  - id: swarm
    file: playbooks/swarm-site.yml
    name: "Etapa 2 · Swarm + Traefik"
    description: >-
      Docker, Swarm, Traefik con wildcard *.<base_domain> por DNS en
      Cloudflare, y whoami como prueba. Idempotente.
    hosts: swarm
    risk: change
    verify: swarm-verify
    rollback: swarm-teardown
    become: true
    become_password_from: OPS_PASSWORD
    vars:
      - { name: ops_user, default: infra_devops }
      - { name: public_ip, required: true }
      - { name: dns_zone, description: "El nombre de la zona en Cloudflare (guz-studio.dev), no su Zone ID.", required: true }
      - { name: base_domain, description: "El subdominio propio del servidor dentro de la zona (gstd.guz-studio.dev), nunca la zona misma: <base_domain> y *.<base_domain> apuntarán aquí.", required: true }
      - { name: acme_email, description: El correo de Let's Encrypt., required: true }
      - { name: acme_dns_provider, default: cloudflare }
      - { name: firewall_web_ports, default: [80, 443] }
      - { name: secret_hmac_key_path, default: /etc/cac/secret-hmac.key }
      - { name: traefik_image, default: "traefik:v3.6" }
      - { name: traefik_network, default: traefik_proxy }
      - { name: whoami_image, default: "traefik/whoami:v1.11" }
      - name: cloudflare_dns_token
        description: Token de Cloudflare con DNS Edit y Zone Read sobre la zona.
        secret: true
        from: CLOUDFLARE_DNS_TOKEN

  - id: swarm-verify
    file: playbooks/swarm-verify.yml
    name: Verificar Swarm
    description: Nodo, servicios y whoami por HTTPS con certificado válido. No cambia nada.
    hosts: swarm
    risk: read
    become: true
    become_password_from: OPS_PASSWORD
    vars:
      - { name: public_ip, required: true }
      - { name: base_domain, required: true }

  - id: swarm-teardown
    file: playbooks/swarm-teardown.yml
    name: Desmontar Swarm
    description: Quita los stacks, sale del Swarm y desinstala Docker. Destructivo.
    hosts: swarm
    risk: destructive
    verify: test
    rollback: swarm
    become: true
    become_password_from: OPS_PASSWORD

  - id: k8s
    file: playbooks/k8s-site.yml
    name: "Etapa 2 · Kubernetes (kubeadm) como pixel-vps"
    description: >-
      containerd, kubeadm, Cilium, MetalLB, Envoy Gateway, cert-manager con el
      wildcard por DNS, y whoami por HTTPRoute. Antes, desmontar Swarm. Idempotente.
    hosts: k8s_control_plane
    risk: change
    verify: k8s-verify
    rollback: k8s-teardown
    become: true
    become_password_from: OPS_PASSWORD
    vars:
      - { name: public_ip, required: true }
      - { name: dns_zone, description: "El nombre de la zona en Cloudflare (guz-studio.dev), no su Zone ID.", required: true }
      - { name: base_domain, description: "El subdominio propio del servidor dentro de la zona (gstd.guz-studio.dev), nunca la zona misma: <base_domain> y *.<base_domain> apuntarán aquí.", required: true }
      - { name: acme_email, required: true }
      # Un Certificate wildcard por entrada (`<d>` y `*.<d>`), por DNS-01,
      # todos en el listener https. Cada una cuelga de dns_zone. Vacío = sólo
      # base_domain. No crea ningún registro DNS: el wildcard de la zona como
      # certificado está bien; como registro se llevaría todo subdominio a
      # este servidor (incidente 80e773bb).
      - name: certificates
        description: "Dominios con certificado wildcard, uno por zona dentro de dns_zone (gstd.guz-studio.dev, guz-studio.dev). Vacío: sólo base_domain. No crea DNS."
        type: list
        default: []
      # Si se pone (turn.guz-studio.dev), el Gateway añade el listener
      # turn-tls en el 443 (TLS sin terminar, por SNI) para el TURN de LiveKit.
      - { name: livekit_turn_host, description: "Host del TURN de LiveKit por el 443 del Gateway; vacío = sin listener turn-tls.", default: "" }
      - { name: firewall_web_ports, default: [80, 443] }
      # Lo que LiveKit necesita abierto en el host (media 7882, TURN 3478).
      - { name: firewall_udp_ports, description: "Puertos UDP abiertos en el host.", type: list, default: [] }
      - { name: secret_hmac_key_path, default: /etc/cac/secret-hmac.key }
      - { name: whoami_image, default: "traefik/whoami:v1.11" }
      # El mismo menor de Kubernetes que pixel-vps (1.35) y lo demás en su
      # última versión publicada (leídas el 3-nov-2026): gstd va por delante y
      # ensaya lo que después se sube en pixel-vps. Cada addon tiene que
      # soportar el menor de k8s: la tabla está en
      # `ansible::tests::every_addon_supports_the_kubernetes_minor`.
      - { name: k8s_version, default: "1.35.10" }
      - { name: k8s_minor, default: "1.35" }
      # containerd sale del repo de Docker (containerd.io), que no empaqueta
      # cada parche río arriba: el ensayo del 3-nov-2026 cayó con «no
      # available installation candidate for containerd.io=2.2.10». Antes de
      # subirlo, `apt-cache madison containerd.io` en el servidor.
      - { name: containerd_version, default: "2.4.2" }
      - { name: cilium_version, default: "1.19.10" }
      - { name: metallb_version, default: "0.16.1" }
      - { name: envoy_gateway_version, default: "v1.9.3" }
      # No la de pixel-vps (v1.14.0): esa no puede borrar el TXT del reto DNS
      # desde que Cloudflare dejó de devolver la zona en cada registro
      # (cert-manager#7540, arreglado en 1.16.4/1.17.1), y el certificado no
      # se emite nunca (gstd, 2-nov-2026).
      - { name: cert_manager_version, default: "v1.21.3" }
      # helm 3: el módulo kubernetes.core.helm no está probado con helm 4.
      - { name: helm_version, default: "v3.22.1" }
      # Almacenamiento por defecto (como pixel-vps): un PVC sin StorageClass
      # se queda Pending para siempre y CNPG no arranca.
      - { name: local_path_provisioner_version, default: "v0.0.37" }
      # `kubectl top` y el consumo que enseña el hub de cac.
      - { name: metrics_server_version, description: Chart de metrics-server., default: "3.14.0" }
      # pixel-vps usa el pool por defecto de Cilium (10.0.0.0/8), que se solapa
      # con la red de Services (10.96.0.0/12). Aquí no.
      - { name: pod_cidr, default: 10.244.0.0/16 }
      - { name: service_cidr, default: 10.96.0.0/12 }
      - name: cloudflare_dns_token
        description: Token de Cloudflare con DNS Edit y Zone Read sobre la zona.
        secret: true
        from: CLOUDFLARE_DNS_TOKEN

  - id: k8s-verify
    file: playbooks/k8s-verify.yml
    name: Verificar Kubernetes
    description: Nodo, pods, Gateway, certificado y whoami por HTTPS. No cambia nada.
    hosts: k8s_control_plane
    risk: read
    become: true
    become_password_from: OPS_PASSWORD
    vars:
      - { name: base_domain, required: true }

  - id: cnpg
    file: playbooks/cnpg-site.yml
    name: "Postgres con CloudNativePG"
    description: >-
      Encima de k8s: el operador de CNPG y el plugin barman-cloud, y un clúster
      `postgres` en el namespace data con una instancia, su rol dueño, WAL
      archivado y backup diario a S3. Idempotente. Trae sus propios secretos.
    hosts: k8s_control_plane
    risk: change
    verify: cnpg-verify
    # Borrar un Postgres no se deshace con un playbook: se decide a mano, con
    # un backup delante.
    rollback: manual
    become: true
    become_password_from: OPS_PASSWORD
    vars:
      # El chart 0.29.1 instala el operador 1.30.1. El 0.27 instalaba 1.28,
      # que llegó a fin de vida el 30-jun-2026 (es el de pixel-vps).
      - { name: cnpg_version, description: Chart del operador de CNPG (0.29.1 = operador 1.30.1)., default: "0.29.1" }
      - { name: cnpg_barman_plugin_version, description: Chart del plugin barman-cloud (0.8.1 = v0.15.1)., default: "0.8.1" }
      - { name: cnpg_postgres_image, description: "Imagen de Postgres de CNPG (la familia standard trae pgvector y pgaudit).", default: "ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie" }
      # Una: en un nodo la segunda instancia duplica el disco y no sobrevive a
      # perder el disco. Lo que protege es el backup.
      - { name: cnpg_instances, default: 1 }
      - { name: cnpg_storage_size, default: "40Gi" }
      - { name: cnpg_database, description: La base que nace con el clúster., required: true }
      - { name: cnpg_owner, description: El rol dueño de esa base (la app entra con él)., required: true }
      - { name: cnpg_backup_bucket, description: "Bucket de S3 de barman (infra/terraform/cnpg-backups, output bucket_name).", required: true }
      - { name: cnpg_backup_region, default: "mx-central-1" }
      - { name: cnpg_backup_retention, default: "30d" }
      - { name: cnpg_backup_schedule, description: "Cron de seis campos (segundos primero), en UTC.", default: "0 0 4 * * *" }
      - name: cnpg_s3_access_key_id
        description: Llave del usuario IAM de barman (output access_key_id).
        secret: true
        from: CNPG_S3_ACCESS_KEY_ID
      - name: cnpg_s3_secret_access_key
        secret: true
        from: CNPG_S3_SECRET_ACCESS_KEY
      - name: cnpg_owner_password
        description: La contraseña del rol dueño (generada en 1Password).
        secret: true
        from: CNPG_OWNER_PASSWORD

  - id: cnpg-verify
    file: playbooks/cnpg-verify.yml
    name: Verificar Postgres
    description: Clúster listo, WAL archivado, un backup completo en S3 y la base contesta. No cambia nada.
    hosts: k8s_control_plane
    risk: read
    become: true
    become_password_from: OPS_PASSWORD

  - id: valkey
    file: playbooks/valkey-site.yml
    name: Valkey
    description: >-
      Encima de k8s: el bus de eventos de cac-service. Un StatefulSet `valkey`
      en el namespace data con la imagen oficial, contraseña, AOF en un PVC y
      sin Sentinel. Idempotente. Trae su propio secreto.
    hosts: k8s_control_plane
    risk: change
    verify: valkey-verify
    # Lo que guarda es un bus: quitarlo es borrar el StatefulSet y su PVC, y
    # eso se decide a mano.
    rollback: manual
    become: true
    become_password_from: OPS_PASSWORD
    vars:
      # Fijada por digest (índice multiarquitectura de 9.0.7, 27-oct-2026).
      - { name: valkey_image, description: Imagen oficial de Valkey fijada por digest., default: "valkey/valkey:9.0.7@sha256:7e1deda01b64ece3167d370ab5be3452d29734feec22cbcbc69b3a64f6859d6d" }
      - { name: valkey_storage_size, default: "2Gi" }
      # Sin desalojo: un bus que tira claves por memoria pierde eventos sin
      # avisar; mejor que falle la escritura y se vea.
      - { name: valkey_maxmemory, description: Tope de memoria de Valkey (noeviction)., default: "512mb" }
      - name: valkey_password
        description: La contraseña de Valkey (generada en 1Password).
        secret: true
        from: VALKEY_PASSWORD

  - id: valkey-verify
    file: playbooks/valkey-verify.yml
    name: Verificar Valkey
    description: Listo, pide contraseña, contesta PONG con ella y escribe el AOF. No cambia nada.
    hosts: k8s_control_plane
    risk: read
    become: true
    become_password_from: OPS_PASSWORD

  - id: runner
    file: playbooks/runner-site.yml
    name: Runner de GitHub Actions
    description: >-
      Encima de k8s: el controlador de ARC y un runner scale set registrado en
      la org de GitHub con su GitHub App, un pod por job con Docker (dind) y
      una cuenta de servicio sin permisos. Idempotente. Trae sus propios secretos.
    hosts: k8s_control_plane
    risk: change
    verify: runner-verify
    # Quitarlo es desinstalar dos charts y sus CRD; se decide a mano.
    rollback: manual
    become: true
    become_password_from: OPS_PASSWORD
    vars:
      # Controlador y scale set van con la misma versión: ARC no admite mezclarlas.
      - { name: runner_arc_version, description: Versión de los charts de ARC (controlador y scale set)., default: "0.15.1" }
      - { name: runner_image, description: "Imagen de los pods runner (ghcr.io/g-studio-labs/actions-runner:<fecha>-<sha>, la publica su workflow `imagen`).", required: true }
      - { name: runner_github_config_url, description: "La org (o el repo) de GitHub donde se registra el scale set.", required: true }
      - { name: runner_scale_set_name, description: "El nombre del scale set: lo que va en `runs-on`.", required: true }
      - { name: runner_max, description: Cuántos jobs a la vez como mucho., default: 3 }
      - name: runner_deploy_namespaces
        description: >-
          Los namespaces donde el runner puede desplegar (se crean con un Role
          `ci-deploy` para la cuenta de los pods runner, sólo ahí).
        type: list
        default: []
      - name: runner_github_app_id
        secret: true
        from: ARC_GITHUB_APP_ID
      - name: runner_github_app_installation_id
        secret: true
        from: ARC_GITHUB_APP_INSTALLATION_ID
      - name: runner_github_app_private_key
        description: La llave PEM de la GitHub App del runner.
        secret: true
        from: ARC_GITHUB_APP_PRIVATE_KEY

  - id: runner-verify
    file: playbooks/runner-verify.yml
    name: Verificar el runner
    description: Controlador listo, listener del scale set conectado a GitHub y la cuenta de los pods sin permisos. No cambia nada.
    hosts: k8s_control_plane
    risk: read
    become: true
    become_password_from: OPS_PASSWORD
    vars:
      - { name: runner_scale_set_name, required: true }

  - id: k8s-teardown
    file: playbooks/k8s-teardown.yml
    name: Desmontar Kubernetes
    description: kubeadm reset, paquetes fuera y red limpia. Destructivo.
    hosts: k8s_control_plane
    risk: destructive
    verify: test
    rollback: k8s
    become: true
    become_password_from: OPS_PASSWORD

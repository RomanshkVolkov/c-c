---
# Los hosts se nombran como en cac. `ansible_host` es el alias de ~/.ssh/config
# de quien lo corre: así OpenSSH usa su llave y su usuario sin ofrecer todas
# las del agente (con muchas, el servidor corta antes de llegar a la buena).
all:
  children:
    swarm:
      hosts:
        gstd:
    k8s_control_plane:
      hosts:
        gstd:
  hosts:
    gstd:
      ansible_host: gstd

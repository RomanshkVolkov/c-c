# La versión web de cac, servida en https://cac.guz-studio.dev/app.
#
# Sólo estáticos: la API sigue en el backend, en el mismo dominio, y el Gateway
# reparte por ruta (ver k8s.yaml). Este nginx no ve nunca un /api.
server {
  listen 8080;
  server_name _;

  # Redirecciones relativas. Sin esto, pedir `/app` (sin barra) redirigía a
  # `http://cac.guz-studio.dev:8080/app/`: nginx escribe la dirección entera con
  # **su** puerto, y detrás del Gateway ese puerto no existe desde fuera.
  absolute_redirect off;
  root /usr/share/nginx/html;

  # Los trozos llevan su hash en el nombre: se pueden guardar para siempre.
  location /app/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # El index y el service worker, nunca de caché: son lo que dice qué trozos
  # pedir, y uno viejo dejaría a alguien en la versión anterior sin saberlo.
  location = /app/index.html {
    add_header Cache-Control "no-cache";
  }
  location = /app/sw.js {
    add_header Cache-Control "no-cache";
    add_header Service-Worker-Allowed "/app/";
  }

  # Rutas de la SPA (`/app/tasks`, `/app/chat`…): todas al index, que el
  # router de React resuelve.
  location /app/ {
    try_files $uri $uri/ /app/index.html;
  }

  # nginx no conoce `.webmanifest` y lo daría como `application/octet-stream`.
  # Sólo aquí, y no con un bloque `types` global: ése **reemplaza** todos los
  # tipos heredados y el JavaScript saldría como text/html (comprobado).
  location = /app/manifest.webmanifest {
    default_type application/manifest+json;
    types {}
  }

  location = /healthz {
    access_log off;
    return 200 "ok";
  }
}

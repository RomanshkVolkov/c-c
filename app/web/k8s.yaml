# La versión web de cac en https://cac.guz-studio.dev/app (W1).
#
# Un Deployment propio y una HTTPRoute propia, y no una regla más en la del
# backend: así desplegar la web no toca el backend ni al revés. El Gateway
# junta las dos rutas del mismo host y gana el prefijo más largo, así que
# /app va aquí y todo lo demás (/api, /webhooks…) sigue en cac-service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cac-web
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cac-web
  template:
    metadata:
      labels:
        app: cac-web
    spec:
      containers:
        - name: web
          image: ghcr.io/romanshkvolkov/c-c/web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cac-web
  namespace: default
spec:
  selector:
    app: cac-web
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cac-web-route
  namespace: default
spec:
  parentRefs:
    - name: gateway-api
      namespace: default
  hostnames:
    - "cac.guz-studio.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /app
      backendRefs:
        - name: cac-web
          port: 80

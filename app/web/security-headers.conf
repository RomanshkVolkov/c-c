# Cabeceras de seguridad de la versión web (barrido, 6-oct-2026). En un fichero
# aparte porque nginx **no hereda** `add_header` en una location que declare el
# suyo: cada location con cabeceras propias lo incluye, o se quedaría sin éstas.
#
# La política: sólo código de este origen (ni scripts en línea ni `eval`; la
# web no tiene ninguno), la API en el mismo origen, y las imágenes de cualquier
# https porque un doc o una tarea puede enlazar una. Los estilos en línea sí,
# porque React los pone en atributos `style`. Nadie la puede meter en un marco.
#
# Y el SFU de las llamadas (W3): la señalización va por `wss://rtc…`, y
# `livekit-client` pregunta a `https://rtc…/rtc/validate` cuando una conexión
# falla, para decir por qué. Sin las dos, la llamada no conecta y la CSP no
# avisa: sólo bloquea. Lo vigila `src/lib/web-csp.test.ts`.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data:; connect-src 'self' wss://rtc.guz-studio.dev https://rtc.guz-studio.dev; worker-src 'self'; manifest-src 'self'; frame-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

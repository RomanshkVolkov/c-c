[package]
name = "app"
version = "0.1.0"
license = "AGPL-3.0-or-later"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
keyring = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
crypto_box = "0.9"
blake2 = "0.10"
base64 = "0.22"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "rt-multi-thread", "time"] }
futures-util = "0.3"
image = "0.25"
webp = "0.3"
tauri-plugin-dialog = "2.7.0"
tauri-plugin-fs = "2.5.0"
jsonwebtoken = "9"
uuid = { version = "1", features = ["v4", "v7"] }
cuid2 = "0.1"
bcrypt = "0.16"
argon2 = "0.5"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
hmac = "0.12"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
portable-pty = "0.9.0"
livekit = { version = "0.8.3", features = ["rustls-tls-native-roots"] }
cpal = "0.18.2"
tokio-stream = "0.1.19"
nokhwa = { version = "0.10.11", features = ["input-native"] }

# WebRTC en el webview de Linux. La versión y las features tienen que casar con
# las de tauri (Cargo.lock: webkit2gtk 2.0.x); v2_38 es la puerta tras la que
# vive `set_enable_webrtc`.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_38"] }

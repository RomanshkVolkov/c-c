[package]
name = "app"
version = "0.1.0"
license = "AGPL-3.0-or-later"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Sólo para escuchar a libwebrtc. El SDK ya instala un sumidero de sus registros
# a nivel VERBOSE y los reenvía a `log::debug!(target: "libwebrtc")`; sin una
# implementación de `log` en el proceso, esa macro no hace nada y todo lo que
# libwebrtc cuenta de sí mismo se tira a la basura. Ver `voice::escuchar_al_sdk`.
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
keyring = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
crypto_box = "0.9"
blake2 = "0.10"
base64 = "0.22"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "rt-multi-thread", "time"] }
futures-util = "0.3"
image = "0.25"
# JPEG para las tramas de vídeo de la voz. Rust puro con SIMD, cero
# dependencias del sistema.
#
# **No es el más rápido y se eligió a sabiendas.** libjpeg-turbo tarda 4,6 ms
# en 1080p contra 30,2 de éste (`docs/voz-video.md` §3), pero quiere compilar
# libjpeg-turbo desde fuente con `cmake` y `nasm` en los tres sistemas de CI, y
# esa deuda no la paga lo que ganamos: publicamos vídeo a 720p, donde éste
# tarda 11,4 ms — un tercio de núcleo a 30 tramas por segundo, con la
# codificación además hecha sólo cuando la pantalla pide la imagen.
#
# Si algún día se publica a 1080p, o si se ven cuatro pantallas compartidas a
# la vez, el cambio es la función `comprimir` de `video_frames.rs` y añadir
# `cmake`/`nasm` a los tres runners. Está medido para poder decidirlo entonces.
jpeg-encoder = { version = "0.6", features = ["simd"] }
webp = "0.3"
tauri-plugin-dialog = "2.7.0"
tauri-plugin-fs = "2.5.0"
jsonwebtoken = "9"
uuid = { version = "1", features = ["v4", "v7"] }
cuid2 = "0.1"
bcrypt = "0.16"
argon2 = "0.5"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
hmac = "0.12"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
portable-pty = "0.9.0"
# Sin `glib-main-loop` a propósito, y no por olvido.
#
# La característica existe para el capturador de escritorio en Wayland, que
# habla con xdg-desktop-portal por D-Bus y necesita que alguien despache el
# contexto de GLib. Pero lo que hace es arrancar un `g_main_loop_run` sobre el
# **contexto por defecto global** desde un hilo suelto — y en una app GTK ese
# contexto es el de la interfaz. Un hilo que no es el principal despachando
# fuentes de GTK es corrupción esperando su turno.
#
# Lo hacemos nosotros y bien: un `GMainContext` propio, empujado como
# thread-default en el hilo de captura antes de crear el capturador, e iterado
# sólo desde ahí. Ver `arrancar_pantalla`.
livekit = { version = "0.8.3", features = ["rustls-tls-native-roots"] }
cpal = "0.18.2"
tokio-stream = "0.1.19"
nokhwa = { version = "0.10.11", features = ["input-native"] }

# WebRTC en el webview de Linux. La versión y las features tienen que casar con
# las de tauri (Cargo.lock: webkit2gtk 2.0.x); v2_38 es la puerta tras la que
# vive `set_enable_webrtc`.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_38"] }

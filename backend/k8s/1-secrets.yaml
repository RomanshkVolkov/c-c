apiVersion: v1
kind: Secret
metadata:
  name: cac-secret
  namespace: default

type: kubernetes.io/basic-auth
data:
  DATABASE_URL: ""
  JWT_SECRET_ACCESS: ""
  JWT_SECRET_REFRESH: ""
  # Shared event bus. Required while `replicas` is greater than 1: the hub is
  # in-memory, so without it a console connected to one pod never sees an event
  # published on another — new reports arrive with no notification and no
  # refresh, and the user finds out by reloading. Empty is not an error; the
  # backend warns at startup and degrades to per-pod delivery.
  #
  #   VALKEY_ADDR      valkey.data.svc.cluster.local:6379
  #   VALKEY_PASSWORD  from the `valkey-auth` secret in the `data` namespace
  #
  # The password is copied rather than referenced because Kubernetes secrets are
  # namespaced and cac runs in `default`. Copy it with:
  #
  #   kubectl create secret generic cac-valkey -n default \
  #     --from-literal=VALKEY_ADDR=valkey.data.svc.cluster.local:6379 \
  #     --from-literal=VALKEY_PASSWORD="$(kubectl get secret -n data valkey-auth \
  #        -o jsonpath='{.data.valkey-password}' | base64 -d)"
  #
  # Rotating Valkey's password means re-running that command; nothing detects
  # the drift on its own beyond the stream going quiet.

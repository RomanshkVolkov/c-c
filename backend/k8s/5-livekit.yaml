# LiveKit: el SFU que reparte voz y vídeo de los canales.
#
# `hostNetwork: true` no es pereza. El media de WebRTC va por UDP y necesita que
# la IP y el puerto que el servidor anuncia en sus candidatos ICE sean los que
# el cliente puede alcanzar de verdad. Detrás de un Service ClusterIP o de un
# NodePort con SNAT, LiveKit anunciaría una dirección interna y la conexión se
# quedaría negociando para siempre. Con la red del host, lo que anuncia es lo
# que hay.
#
# `use_external_ip: true` cierra el círculo: el VPS está detrás del NAT de AWS,
# así que la IP de su interfaz no es la pública. LiveKit la descubre por STUN al
# arrancar y anuncia esa.
apiVersion: v1
kind: ConfigMap
metadata:
  name: livekit-config
  namespace: default
data:
  livekit.yaml: |
    port: 7880
    log_level: info
    rtc:
      # Un solo puerto UDP muxeado en vez de un rango: es un agujero que abrir
      # en el security group en vez de diez mil, y para el tamaño de equipo que
      # esto sirve no hay diferencia de rendimiento.
      udp_port: 7882
      # Respaldo para redes que bloquean UDP. Peor latencia, pero conecta.
      tcp_port: 7881
      use_external_ip: true
    # Redis es el bus por el que el SFU y Egress se hablan (psrpc). Sin esto no
    # hay grabación, y con esto LiveKit entra en modo distribuido: si el bus
    # cae, **sigue sirviendo las salas que ya tiene pero no crea nuevas**. Ése
    # es el precio de grabar, y es un pod propio —no el Valkey de `data`— para
    # que la voz no dependa del bus de eventos de cac ni de una contraseña
    # copiada a mano entre namespaces.
    #
    # Quitar estas dos líneas apaga la grabación y nada más.
    redis:
      address: livekit-redis.default.svc.cluster.local:6379
    # Explícitos aunque sean los valores por defecto, porque con grabación
    # pasan a importar: el participante de Egress es oculto y no cuenta como
    # gente, así que al irse todos la sala tarda `empty_timeout` en cerrarse y
    # el vídeo se lleva ese rato en negro al final. Quien para antes es el
    # reloj del backend: tick de 10 s y dos ticks seguidos sin nadie humano
    # dentro, o sea **unos 20 s** — que caben dentro del `departure_timeout` de
    # una reconexión, así que a nadie se le corta la reunión por perder el
    # socket un momento.
    room:
      empty_timeout: 300
      departure_timeout: 20
    # Sin `keys` aquí: llegan por LIVEKIT_KEYS desde el Secret, para que este
    # ConfigMap se pueda leer sin exponer nada.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit
  namespace: default
spec:
  replicas: 1
  # Recreate y no RollingUpdate, y es consecuencia directa de `hostNetwork`:
  # los puertos del host son uno solo, así que el pod nuevo no puede
  # programarse mientras el viejo los tenga cogidos — «didn't have free ports»
  # y el despliegue se atasca para siempre. Se mata el viejo primero.
  #
  # El precio es unos segundos sin voz en cada despliegue. Con una réplica no
  # había alta disponibilidad que perder de todas formas.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: livekit
  template:
    metadata:
      labels:
        app: livekit
    spec:
      # Sin las variables de enlace de Kubernetes, y esto no es higiene: son
      # obligatorias de apagar aquí.
      #
      # Kubernetes inyecta en cada pod una variable por Service del namespace,
      # al estilo de los viejos enlaces de Docker: `LIVEKIT_PORT=tcp://10.x:7880`
      # para un Service llamado `livekit`. LiveKit lee `LIVEKIT_PORT` como su
      # propio `--port`, intenta parsear «tcp://10.101.6.157:7880» como número y
      # muere al arrancar. Una colisión de nombres entre dos convenciones que no
      # se conocen.
      #
      # Apagarlas es más honesto que renombrar el Service para esquivar la
      # inyección: no queremos esas variables, así que se dicen que no.
      enableServiceLinks: false
      hostNetwork: true
      # Obligado con hostNetwork: sin esto el pod hereda el resolv.conf del host
      # y deja de ver el DNS del clúster.
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: livekit
          # Pineado por **tag y digest**, no `latest`, y no es higiene: es lo
          # que sostiene la grabación.
          #
          # Egress y el servidor hablan por psrpc con los tipos de
          # `livekit/protocol`, así que sus versiones tienen que casar. El
          # Egress que se despliega (v1.14.1, 14-ago-2026) pide `protocol
          # v1.50.1`; v1.13.5 va en la misma serie v1.50.x. El siguiente
          # servidor, v1.13.7, salta a v1.51 y **desparejaría**.
          #
          # Medido el 16-sep-2026: `latest` ya apuntaba a un digest distinto
          # (`6fd3b708…`) del que corría (`3497163e…`). Con etiqueta `latest`
          # el `imagePullPolicy` por defecto es `Always`, así que **el próximo
          # reinicio del pod habría subido el SFU solo**. Este digest es
          # exactamente el que ya estaba sirviendo.
          image: livekit/livekit-server:v1.13.5@sha256:3497163e15c48fef6e7830c78716f9e9d5edc28abf7aa90b61c86e93bbc306b1
          args: ["--config", "/etc/livekit/livekit.yaml"]
          env:
            # Formato "clave: secreto". Lo consume LiveKit al arrancar.
            - name: LIVEKIT_KEYS
              valueFrom:
                secretKeyRef:
                  name: livekit-secret
                  key: LIVEKIT_KEYS
          ports:
            - name: signal
              containerPort: 7880
            - name: rtc-tcp
              containerPort: 7881
            - name: rtc-udp
              containerPort: 7882
              protocol: UDP
          volumeMounts:
            - name: config
              mountPath: /etc/livekit
          readinessProbe:
            httpGet:
              path: /
              port: 7880
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: livekit-config
---
apiVersion: v1
kind: Service
metadata:
  name: livekit
  namespace: default
spec:
  selector:
    app: livekit
  ports:
    - name: signal
      port: 7880
      targetPort: 7880
---
# El bus de Egress. Un Valkey mínimo y sin memoria: lo único que guarda son
# mensajes en vuelo entre el SFU y el grabador.
#
# Sin persistencia a propósito (`--save ""`, `--appendonly no`): no hay nada que
# corromper ni que restaurar. Si se reinicia, los Egress en vuelo se dan por
# fallidos y el reloj del backend lo ve en el siguiente latido.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit-redis
  namespace: default
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: livekit-redis
  template:
    metadata:
      labels:
        app: livekit-redis
    spec:
      # La misma trampa que el SFU: k8s inyecta LIVEKIT_PORT y compañía, y no
      # queremos ninguna de esas variables aquí tampoco.
      enableServiceLinks: false
      automountServiceAccountToken: false
      containers:
        - name: valkey
          image: valkey/valkey:8-alpine@sha256:d2e18f3410b6f616de1417f570fa55261af2898b9c5b2cfb6781ce2373ea43d1
          args:
            - "--save"
            - ""
            - "--appendonly"
            - "no"
            - "--maxmemory"
            - "64mb"
            - "--maxmemory-policy"
            - "allkeys-lru"
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 2
            periodSeconds: 10
            # Cinco segundos y no el segundo que trae el chart de Bitnami por
            # defecto: con un plazo corto la sonda se queda huérfana cuando el
            # contenedor está estrangulado, y PID 1 no recoge a nadie. Eso
            # dejó 1.529 zombis en el Valkey de `data` (12-sep-2026).
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: livekit-redis
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: livekit-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
# Sólo el SFU y el grabador entran al bus.
#
# Es una **CiliumNetworkPolicy** y no la estándar de Kubernetes, y eso se midió:
# el SFU corre con `hostNetwork`, así que sus paquetes salen con la IP del nodo
# y ningún `podSelector` los describe. La tentación es poner un `ipBlock` con el
# rango de pods — no funciona: la especificación dice que `ipBlock` es para
# tráfico de fuera del clúster, y Cilium la cumple. Con esa policy puesta, un
# pod cualquiera **no** alcanzaba el bus (probado el 16-sep-2026), y el SFU
# tampoco lo habría alcanzado: la voz se habría roto al arrancar.
#
# `fromEntities: host` es la forma que Cilium da para decir «lo que sale de la
# máquina», que es exactamente dónde vive el SFU.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: livekit-redis
  namespace: default
spec:
  endpointSelector:
    matchLabels:
      app: livekit-redis
  ingress:
    # El SFU, que va en la red del host.
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    # El grabador, que sí es un pod normal.
    - fromEndpoints:
        - matchLabels:
            app: livekit-egress
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
